name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Run test suite
        run: |
          set -e
          fail=0
          for f in tests/test_*.py; do
            echo "::group::$f"
            if ! python "$f"; then
              echo "::error file=$f::Test file failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  self-scan:
    name: Self-scan (analyzer on its own code)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run analyzer on its own source
        run: |
          python -m ai_pattern_analyzer --dirs ./ai_pattern_analyzer --profile ci --format json > self-scan.json
          echo "Self-scan complete. Schema version:"
          python -c "import json; d=json.load(open('self-scan.json')); print(d.get('schema_version', 'unknown'))"

      - name: Upload self-scan report
        uses: actions/upload-artifact@v4
        with:
          name: self-scan-report
          path: self-scan.json
          retention-days: 30
